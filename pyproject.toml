[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cex-installguard"
version = "2.1.0"
description = "Analyze shell and install scripts before execution."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "CyberEmpireX" }]
license = { text = "MIT" }
keywords = ["security", "termux", "shell", "analysis", "android"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
  "Topic :: System :: Shells",
  "Topic :: Utilities",
]

[project.scripts]
cex-installguard = "installguard.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["installguard"]
